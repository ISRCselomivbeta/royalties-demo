<style>
    /* ========== CARDS DE MÚSICA ========== */
    .music-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 1rem;
        margin-top: 1rem;
    }
    
    .music-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 1rem;
        overflow: hidden;
        transition: all 0.3s ease;
        cursor: pointer;
    }
    
    .music-card:hover {
        transform: translateY(-5px);
        border-color: var(--neon-green);
        box-shadow: 0 10px 20px rgba(0, 255, 136, 0.1);
    }
    
    .music-cover {
        width: 100%;
        height: 180px;
        object-fit: cover;
    }
    
    .music-info {
        padding: 1rem;
    }
    
    .music-title {
        font-weight: 600;
        margin-bottom: 0.25rem;
        color: var(--text-light);
    }
    
    .music-artist {
        color: var(--text-muted);
        font-size: 0.875rem;
        margin-bottom: 0.75rem;
    }
    
    .music-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
    }
    
    .music-price {
        color: var(--neon-green);
        font-weight: 700;
        font-size: 1.125rem;
    }
    
    .music-percent {
        background: rgba(0, 123, 255, 0.1);
        color: #007bff;
        padding: 0.25rem 0.75rem;
        border-radius: 1rem;
        font-size: 0.75rem;
        font-weight: 600;
    }
</style>
