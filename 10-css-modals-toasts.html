<!-- CSS MODAIS E TOASTS - PARTE 10/16 -->
<!-- ============================================ -->
<style>
    /* ========== MODAIS ========== */
    .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.8);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1200;
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s ease;
    }
    
    .modal-overlay.show {
        opacity: 1;
        visibility: visible;
    }
    
    .modal-content {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 1rem;
        width: 90%;
        max-width: 500px;
        max-height: 90vh;
        overflow-y: auto;
        transform: translateY(20px);
        transition: transform 0.3s ease;
    }
    
    .modal-overlay.show .modal-content {
        transform: translateY(0);
    }
    
    .modal-header {
        padding: 1.5rem;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    
    .modal-title {
        color: var(--text-light);
        font-weight: 700;
        margin-bottom: 0;
    }
    
    .modal-close {
        background: none;
        border: none;
        color: var(--text-muted);
        font-size: 1.5rem;
        cursor: pointer;
        padding: 0.25rem;
    }
    
    .modal-body {
        padding: 1.5rem;
    }
    
    .modal-footer {
        padding: 1.5rem;
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: flex-end;
        gap: 1rem;
    }
    
    /* ========== TOASTS ========== */
    .toast-container {
        position: fixed;
        top: 1rem;
        right: 1rem;
        z-index: 1300;
        max-width: 350px;
    }
    
    .toast {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        padding: 1rem;
        margin-bottom: 0.5rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        transform: translateX(100%);
        opacity: 0;
        transition: all 0.3s ease;
    }
    
    .toast.show {
        transform: translateX(0);
        opacity: 1;
    }
    
    .toast.success {
        border-color: var(--neon-green);
        background: rgba(0, 255, 136, 0.1);
    }
    
    .toast.error {
        border-color: #ff3232;
        background: rgba(255, 50, 50, 0.1);
    }
    
    .toast-message {
        flex: 1;
        color: var(--text-light);
    }
</style>
