<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SELO MIV - Recuperar Senha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #07090c 0%, #0c0e12 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8f9fa;
        }
        
        .recovery-card {
            background: #111418;
            border: 1px solid #1e2329;
            border-radius: 1.5rem;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .logo-icon {
            width: 80px;
            height: 80px;
            background: rgba(0, 255, 136, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            border: 2px solid #00ff88;
        }
        
        .logo-icon i {
            font-size: 2.5rem;
            color: #00ff88;
        }
        
        .form-control-custom {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #1e2329;
            border-radius: 0.75rem;
            color: #f8f9fa;
            padding: 0.875rem 1rem;
            width: 100%;
            transition: all 0.3s ease;
        }
        
        .form-control-custom:focus {
            border-color: #00ff88;
            box-shadow: 0 0 0 0.25rem rgba(0, 255, 136, 0.25);
            outline: none;
        }
        
        .btn-miv {
            background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
            border: none;
            border-radius: 0.75rem;
            color: #000;
            font-weight: 700;
            padding: 1rem;
            width: 100%;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .btn-miv:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 255, 136, 0.3);
        }
        
        .btn-miv:disabled {
            opacity: 0.6;
            transform: none;
        }
        
        .spin {
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="recovery-card">
        <div class="logo">
            <div class="logo-icon">
                <i class="bi bi-shield-lock"></i>
            </div>
            <h2 class="text-white mb-2">SELO MIV</h2>
            <p class="text-muted">Recuperação de Senha</p>
        </div>
        
        <!-- Step 1: Solicitar email -->
        <div id="step1">
            <div class="alert alert-info bg-dark border-info mb-3">
                <i class="bi bi-info-circle me-2"></i>
                Digite seu email para receber um link de recuperação.
            </div>
            
            <div class="mb-3">
                <input type="email" id="emailField" class="form-control-custom" placeholder="seu@email.com">
            </div>
            
            <button class="btn-miv" onclick="requestReset()" id="requestBtn">
                <i class="bi bi-send me-2"></i> Enviar link
            </button>
            
            <div class="text-center mt-3">
                <a href="/" class="text-success text-decoration-none">
                    <i class="bi bi-arrow-left me-1"></i> Voltar ao login
                </a>
            </div>
        </div>
        
        <!-- Step 2: Email enviado -->
        <div id="step2" style="display: none;">
            <div class="alert alert-success bg-dark border-success mb-3">
                <i class="bi bi-check-circle me-2"></i>
                Email enviado! Verifique sua caixa de entrada.
            </div>
            
            <p class="text-muted text-center mt-3">
                Não recebeu? <a href="#" onclick="resendEmail()" class="text-success">Tentar novamente</a>
            </p>
        </div>
    </div>
    
    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbwgjor-tLLzVrnJGNHOifL1O2sRBhysKJ3IbVJy_AHgtNqjk-6hazH8xuO6OaDXF_s/exec';
        
        async function requestReset() {
            const email = document.getElementById('emailField').value.trim();
            
            if (!email) {
                alert('Digite seu email');
                return;
            }
            
            const btn = document.getElementById('requestBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="bi bi-arrow-clockwise spin"></i> Enviando...';
            
            try {
                // Simulação - substituir pela chamada real da API
                setTimeout(() => {
                    document.getElementById('step1').style.display = 'none';
                    document.getElementById('step2').style.display = 'block';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-send me-2"></i> Enviar link';
                }, 2000);
                
            } catch (error) {
                alert('Erro ao conectar');
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-send me-2"></i> Enviar link';
            }
        }
        
        function resendEmail() {
            document.getElementById('step2').style.display = 'none';
            document.getElementById('step1').style.display = 'block';
        }
    </script>
</body>
</html>
