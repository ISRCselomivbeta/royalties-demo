<script>
    // ========== CONFIGURAÇÃO ==========
    const CONFIG = {
        API_URL: 'https://script.google.com/macros/s/AKfycbymxN90sRm1FfB7-QdIJRwacUgtHxpjptPSXtjkLWuKOZKHQNKhyT7dA2ikSbvMPZE/exec',
        LOCAL_STORAGE_KEY: 'selo_miv_data',
        VERSION: '2.0.0'
    };

    // ========== ESTADO GLOBAL ==========
    const state = {
        currentUser: null,
        currentToken: null,
        userBalance: 0,
        userPortfolio: [],
        playlist: [],
        currentTrackIndex: 0,
        isPlaying: false,
        isPlayerExpanded: false,
        shuffle: false,
        repeat: false,
        volume: 100,
        youtubePlayer: null,
        progressInterval: null,
        currentInvestTrack: null
    };

    // ========== FUNÇÕES UTILITÁRIAS ==========
    function showToast(message, type = 'success') {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.innerHTML = `
            <i class="bi ${type === 'success' ? 'bi-check-circle' : 'bi-exclamation-triangle'} toast-icon"></i>
            <span>${message}</span>
        `;
        container.appendChild(toast);
        
        setTimeout(() => toast.classList.add('show'), 100);
        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    function showLoading(message = 'Carregando...') {
        const loadingScreen = document.getElementById('loadingScreen');
        const loadingMessage = document.getElementById('loadingMessage');
        
        if (loadingScreen) {
            loadingScreen.style.display = 'flex';
        }
        if (loadingMessage) {
            loadingMessage.textContent = message;
        }
    }

    function hideLoading() {
        const loadingScreen = document.getElementById('loadingScreen');
        if (loadingScreen) {
            loadingScreen.style.display = 'none';
        }
    }

    function showModal(modalId) {
        const modal = document.getElementById(modalId);
        if (modal) {
            modal.classList.add('show');
        }
    }

    function closeModal(modalId) {
        const modal = document.getElementById(modalId);
        if (modal) {
            modal.classList.remove('show');
        }
    }

    function formatCurrency(value) {
        return new Intl.NumberFormat('pt-BR', {
            style: 'currency',
            currency: 'BRL'
        }).format(value || 0);
    }

    function formatDate(dateString) {
        if (!dateString) return '';
        const date = new Date(dateString);
        return date.toLocaleDateString('pt-BR');
    }

    function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    // ========== AUTENTICAÇÃO ==========
    function checkAuth() {
        const userData = localStorage.getItem('miv_user');
        const userToken = localStorage.getItem('miv_token');
        
        if (userData && userToken) {
            try {
                state.currentUser = JSON.parse(userData);
                state.currentToken = userToken;
                initializeApp();
            } catch (error) {
                console.error('Erro ao carregar dados do usuário:', error);
                showLoginScreen();
            }
        } else {
            showLoginScreen();
        }
    }

    function showLoginScreen() {
        document.getElementById('authScreen').style.display = 'flex';
        document.getElementById('mainApp').style.display = 'none';
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('registerForm').style.display = 'none';
    }

    async function handleLogin() {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value.trim();

        if (!email || !password) {
            showToast('Preencha email e senha', 'error');
            return;
        }

        showLoading('Autenticando...');

        try {
            const url = `${CONFIG.API_URL}?action=login&email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`;
            console.log('Enviando login para:', url);
            
            const response = await fetch(url);
            const result = await response.json();
            
            console.log('Resposta do login:', result);
            hideLoading();

            if (result.success) {
                state.currentUser = result.data;
                state.currentToken = result.data.token;
                
                localStorage.setItem('miv_user', JSON.stringify(state.currentUser));
                localStorage.setItem('miv_token', state.currentToken);
                
                showToast(`Bem-vindo, ${result.data.nome}!`);
                initializeApp();
            } else {
                showToast(result.message || 'Erro no login', 'error');
            }
        } catch (error) {
            hideLoading();
            console.error('Erro no login:', error);
            showToast('Erro de conexão com o servidor', 'error');
        }
    }

    async function handleRegister() {
        const nome = document.getElementById('registerName').value.trim();
        const email = document.getElementById('registerEmail').value.trim();
        const password = document.getElementById('registerPassword').value.trim();
        const tipo = document.getElementById('registerType').value;
        const workLink = document.getElementById('registerLink')?.value.trim() || '';

        if (!nome || !email || !password || !tipo) {
            showToast('Preencha todos os campos obrigatórios', 'error');
            return;
        }

        if (password.length < 6) {
            showToast('Senha deve ter pelo menos 6 caracteres', 'error');
            return;
        }

        if (tipo === 'artista' && !workLink) {
            showToast('Artistas devem informar link do trabalho', 'error');
            return;
        }

        showLoading('Criando conta...');

        try {
            const url = `${CONFIG.API_URL}?action=register&nome=${encodeURIComponent(nome)}&email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}&tipo=${tipo}&workLink=${encodeURIComponent(workLink)}`;
            
            const response = await fetch(url);
            const result = await response.json();
            
            hideLoading();

            if (result.success) {
                showToast('Conta criada! Aguarde aprovação administrativa.');
                showLoginForm();
            } else {
                showToast(result.message || 'Erro ao criar conta', 'error');
            }
        } catch (error) {
            hideLoading();
            console.error('Erro no registro:', error);
            showToast('Erro de conexão', 'error');
        }
    }

    function showLoginForm() {
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('registerForm').style.display = 'none';
        document.getElementById('loginEmail').value = '';
        document.getElementById('loginPassword').value = '';
    }

    function showRegisterForm() {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('registerForm').style.display = 'block';
        document.getElementById('registerName').value = '';
        document.getElementById('registerEmail').value = '';
        document.getElementById('registerPassword').value = '';
        document.getElementById('registerType').value = '';
        document.getElementById('artistLinkField').style.display = 'none';
    }

    function toggleArtistField() {
        const type = document.getElementById('registerType').value;
        const field = document.getElementById('artistLinkField');
        field.style.display = type === 'artista' ? 'block' : 'none';
    }

    function logout() {
        if (confirm('Tem certeza que deseja sair?')) {
            localStorage.removeItem('miv_user');
            localStorage.removeItem('miv_token');
            state.currentUser = null;
            state.currentToken = null;
            showLoginScreen();
        }
    }

    // ========== INICIALIZAÇÃO DO APP ==========
    async function initializeApp() {
        if (!state.currentUser) {
            showLoginScreen();
            return;
        }

        // Mostra app
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        
        // Atualiza UI do usuário
        document.getElementById('userBadge').textContent = state.currentUser.tipo === 'artista' ? 'Artista' : 'Ouvinte';
        
        // Mostra painel do artista se for artista
        if (state.currentUser.tipo === 'artista') {
            document.getElementById('artistNavItem').style.display = 'block';
        }
        
        // Carrega dados iniciais
        await loadUserBalance();
        await loadMarketplace();
        await loadPortfolio();
        
        // Configura navegação
        changeSection('marketplace');
    }

    // ========== DADOS DO USUÁRIO ==========
    async function loadUserBalance() {
        if (!state.currentUser) return;
        
        try {
            const url = `${CONFIG.API_URL}?action=get_saldo&token=${state.currentToken}`;
            const response = await fetch(url);
            const result = await response.json();
            
            if (result.success) {
                state.userBalance = result.data.saldo || 0;
                updateBalanceUI();
            }
        } catch (error) {
            console.error('Erro ao carregar saldo:', error);
        }
    }

    function updateBalanceUI() {
        const balanceElement = document.getElementById('currentBalance');
        if (balanceElement) {
            balanceElement.textContent = formatCurrency(state.userBalance);
        }
        
        // Atualiza também em outros lugares que mostram saldo
        const investBalance = document.getElementById('investAvailableBalance');
        if (investBalance) {
            investBalance.textContent = formatCurrency(state.userBalance);
        }
        
        const modalBalance = document.getElementById('modalAvailableBalance');
        if (modalBalance) {
            modalBalance.textContent = formatCurrency(state.userBalance);
        }
    }

    // ========== MARKETPLACE ==========
    async function loadMarketplace() {
        try {
            const url = `${CONFIG.API_URL}?action=get_musicas`;
            const response = await fetch(url);
            const result = await response.json();
            
            if (result.success) {
                state.playlist = result.data || [];
                renderMarketplace(state.playlist);
            } else {
                showEmptyState('marketplaceContent', 'Nenhuma música disponível');
            }
        } catch (error) {
            console.error('Erro ao carregar marketplace:', error);
            showEmptyState('marketplaceContent', 'Erro ao carregar músicas');
        }
    }

    function renderMarketplace(musicas) {
        const container = document.getElementById('marketplaceContent');
        if (!container) return;
        
        if (!musicas || musicas.length === 0) {
            showEmptyState('marketplaceContent', 'Nenhuma música disponível');
            return;
        }
        
        container.innerHTML = '';
        
        musicas.forEach((musica, index) => {
            const card = document.createElement('div');
            card.className = 'music-card';
            card.innerHTML = `
                <img src="${musica.link_capa || 'https://via.placeholder.com/300x300/111418/00ff88?text=MIV'}" 
                     class="music-cover" 
                     alt="${musica.titulo}"
                     onerror="this.src='https://via.placeholder.com/300x300/111418/00ff88?text=MIV'">
                <div class="music-info">
                    <h5 class="music-title">${musica.titulo}</h5>
                    <p class="music-artist">${musica.artista || 'Artista Desconhecido'}</p>
                    <div class="music-meta">
                        <span class="music-price">R$ ${parseFloat(musica.valor_acao || 0).toFixed(2)}</span>
                        <span class="badge bg-primary">${musica.percentual_disponivel || 0}% disp.</span>
                    </div>
                    <div class="d-grid gap-2">
                        <button class="btn btn-sm btn-outline-success" onclick="playTrack(${index})">
                            <i class="bi bi-play-fill"></i> Ouvir
                        </button>
                        <button class="btn btn-sm btn-miv" onclick="openInvestModal(${index})">
                            <i class="bi bi-currency-dollar"></i> Investir
                        </button>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // ========== PORTFÓLIO ==========
    async function loadPortfolio() {
        if (!state.currentUser) return;
        
        try {
            const url = `${CONFIG.API_URL}?action=get_carteira&user_id=${state.currentUser.id}`;
            const response = await fetch(url);
            const result = await response.json();
            
            if (result.success) {
                state.userPortfolio = result.data || [];
                renderPortfolio();
                updatePortfolioValue();
            } else {
                showEmptyState('portfolioContent', 'Nenhum ativo na carteira');
            }
        } catch (error) {
            console.error('Erro ao carregar portfólio:', error);
            showEmptyState('portfolioContent', 'Erro ao carregar carteira');
        }
    }

    async function updatePortfolioValue() {
        if (!state.currentUser) return;
        
        try {
            const url = `${CONFIG.API_URL}?action=get_resumo&token=${state.currentToken}`;
            const response = await fetch(url);
            const result = await response.json();
            
            if (result.success) {
                const valueElement = document.getElementById('portfolioValue');
                if (valueElement) {
                    valueElement.textContent = formatCurrency(result.data.total || 0);
                }
                
                const countElement = document.getElementById('assetsCount');
                if (countElement) {
                    countElement.textContent = `${state.userPortfolio.length} ativo${state.userPortfolio.length !== 1 ? 's' : ''}`;
                }
            }
        } catch (error) {
            console.error('Erro ao atualizar valor do portfólio:', error);
        }
    }

    function renderPortfolio() {
        const container = document.getElementById('portfolioContent');
        if (!container) return;
        
        if (!state.userPortfolio || state.userPortfolio.length === 0) {
            showEmptyState('portfolioContent', 'Nenhum ativo na carteira');
            return;
        }
        
        container.innerHTML = '';
        
        // Agrupa por música
        const portfolioByMusic = {};
        state.userPortfolio.forEach(item => {
            const musicId = item.music_id;
            if (!portfolioByMusic[musicId]) {
                portfolioByMusic[musicId] = {
                    music_id: musicId,
                    quantidade: 0,
                    valor_total: 0,
                    valor_medio: 0
                };
            }
            portfolioByMusic[musicId].quantidade += parseInt(item.quantidade || 0);
            portfolioByMusic[musicId].valor_total += parseFloat(item.valor_total || 0);
        });
        
        // Calcula valor médio
        Object.values(portfolioByMusic).forEach(item => {
            item.valor_medio = item.valor_total / item.quantidade;
        });
        
        // Renderiza cards
        Object.values(portfolioByMusic).forEach((item, index) => {
            // Encontra música correspondente
            const musica = state.playlist.find(m => m.id == item.music_id);
            if (!musica) return;
            
            const card = document.createElement('div');
            card.className = 'music-card';
            card.innerHTML = `
                <img src="${musica.link_capa || 'https://via.placeholder.com/300x300/111418/00ff88?text=MIV'}" 
                     class="music-cover" 
                     alt="${musica.titulo}"
                     onerror="this.src='https://via.placeholder.com/300x300/111418/00ff88?text=MIV'">
                <div class="music-info">
                    <h5 class="music-title">${musica.titulo}</h5>
                    <p class="music-artist">${musica.artista || 'Artista Desconhecido'}</p>
                    
                    <div class="row text-center mb-3">
                        <div class="col-6">
                            <small class="text-muted">Quantidade</small>
                            <div class="fw-bold">${item.quantidade} ações</div>
                        </div>
                        <div class="col-6">
                            <small class="text-muted">Valor Investido</small>
                            <div class="fw-bold text-success">${formatCurrency(item.valor_total)}</div>
                        </div>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button class="btn btn-sm btn-outline-success" onclick="playTrackByMusicId('${item.music_id}')">
                            <i class="bi bi-play-fill"></i> Ouvir
                        </button>
                        <button class="btn btn-sm btn-outline-primary" onclick="buyMoreShares('${item.music_id}')">
                            <i class="bi bi-plus-circle"></i> Comprar Mais
                        </button>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function playTrackByMusicId(musicId) {
        const index = state.playlist.findIndex(m => m.id == musicId);
        if (index !== -1) {
            playTrack(index);
        }
    }

    function buyMoreShares(musicId) {
        const index = state.playlist.findIndex(m => m.id == musicId);
        if (index !== -1) {
            openInvestModal(index);
        }
    }

    // ========== PLAYER DE MÚSICA ==========
    function playTrack(index) {
        if (index < 0 || index >= state.playlist.length) {
            showToast('Música não encontrada', 'error');
            return;
        }
        
        state.currentTrackIndex = index;
        const track = state.playlist[index];
        
        // Atualiza UI do player
        document.getElementById('playerTitle').textContent = track.titulo;
        document.getElementById('playerArtist').textContent = track.artista || 'Artista Desconhecido';
        document.getElementById('playerPrice').textContent = `R$ ${parseFloat(track.valor_acao || 0).toFixed(2)} por ação`;
        
        const albumArt = document.getElementById('playerAlbumArt');
        albumArt.src = track.link_capa || 'https://via.placeholder.com/60x60/111418/00ff88?text=MIV';
        albumArt.onerror = function() {
            this.src = 'https://via.placeholder.com/60x60/111418/00ff88?text=MIV';
        };
        
        // Mostra player
        document.getElementById('playerBar').style.display = 'block';
        
        // Carrega vídeo do YouTube
        loadYouTubeVideo(track.link_youtube);
    }

    function loadYouTubeVideo(url) {
        try {
            const videoId = extractYouTubeId(url);
            if (!videoId) {
                showToast('Link do YouTube inválido', 'error');
                return;
            }
            
            const videoContainer = document.getElementById('videoContainer');
            if (videoContainer) {
                videoContainer.innerHTML = `
                    <iframe 
                        id="youtubeIframe"
                        width="100%" 
                        height="100%" 
                        src="https://www.youtube.com/embed/${videoId}?autoplay=1&controls=1&rel=0" 
                        frameborder="0" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen>
                    </iframe>
                `;
            }
            
            // Atualiza estado
            state.isPlaying = true;
            updatePlayButton();
        } catch (error) {
            console.error('Erro ao carregar vídeo:', error);
            showToast('Erro ao carregar vídeo', 'error');
        }
    }

    function extractYouTubeId(url) {
        if (!url) return null;
        
        const patterns = [
            /(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\n?#]+)/,
            /youtube\.com\/embed\/([^&\n?#]+)/,
            /youtube\.com\/v\/([^&\n?#]+)/
        ];
        
        for (const pattern of patterns) {
            const match = url.match(pattern);
            if (match && match[1]) {
                return match[1];
            }
        }
        
        return null;
    }

    function togglePlay() {
        const iframe = document.getElementById('youtubeIframe');
        if (!iframe) return;
        
        try {
            // Esta é uma abordagem simplificada - em produção, use YouTube Iframe API
            if (state.isPlaying) {
                // Para vídeo alterando src sem autoplay
                const src = iframe.src.replace('autoplay=1', 'autoplay=0');
                iframe.src = src;
                state.isPlaying = false;
            } else {
                // Inicia vídeo alterando src com autoplay
                const src = iframe.src.replace('autoplay=0', 'autoplay=1');
                iframe.src = src;
                state.isPlaying = true;
            }
            updatePlayButton();
        } catch (error) {
            console.error('Erro ao controlar vídeo:', error);
        }
    }

    function updatePlayButton() {
        const button = document.getElementById('playButton');
        if (!button) return;
        
        const icon = button.querySelector('i');
        if (icon) {
            icon.className = state.isPlaying ? 'bi bi-pause-circle-fill' : 'bi bi-play-circle-fill';
        }
    }

    function playNext() {
        if (state.shuffle) {
            const newIndex = Math.floor(Math.random() * state.playlist.length);
            playTrack(newIndex);
        } else {
            const nextIndex = (state.currentTrackIndex + 1) % state.playlist.length;
            playTrack(nextIndex);
        }
    }

    function playPrevious() {
        const prevIndex = state.currentTrackIndex <= 0 ? state.playlist.length - 1 : state.currentTrackIndex - 1;
        playTrack(prevIndex);
    }

    function toggleShuffle() {
        state.shuffle = !state.shuffle;
        const icon = document.getElementById('shuffleIcon');
        if (icon) {
            icon.style.color = state.shuffle ? '#00ff88' : '';
        }
    }

    function toggleRepeat() {
        state.repeat = !state.repeat;
        const icon = document.getElementById('repeatIcon');
        if (icon) {
            icon.style.color = state.repeat ? '#00ff88' : '';
        }
    }

    function setVolume(value) {
        state.volume = value;
        const iframe = document.getElementById('youtubeIframe');
        if (iframe) {
            // O controle de volume via iframe é limitado
            // Em produção, use YouTube Iframe API
        }
    }

    function togglePlayerExpansion() {
        state.isPlayerExpanded = !state.isPlayerExpanded;
        const player = document.getElementById('playerBar');
        const videoContainer = document.getElementById('videoContainer');
        
        if (state.isPlayerExpanded) {
            player.classList.add('expanded');
            if (videoContainer) {
                videoContainer.style.display = 'block';
            }
        } else {
            player.classList.remove('expanded');
            if (videoContainer) {
                videoContainer.style.display = 'none';
            }
        }
    }

    // ========== INVESTIMENTOS ==========
    function openInvestModal(trackIndex) {
        if (!state.currentUser) {
            showToast('Faça login para investir', 'error');
            return;
        }
        
        if (trackIndex < 0 || trackIndex >= state.playlist.length) {
            showToast('Música não encontrada', 'error');
            return;
        }
        
        state.currentInvestTrack = state.playlist[trackIndex];
        
        // Preenche modal
        document.getElementById('investTrackTitle').textContent = state.currentInvestTrack.titulo;
        document.getElementById('investTrackArtist').textContent = state.currentInvestTrack.artista || 'Artista Desconhecido';
        document.getElementById('investUnitPrice').textContent = formatCurrency(state.currentInvestTrack.valor_acao || 0);
        
        // Atualiza saldo disponível
        document.getElementById('investAvailableBalance').textContent = formatCurrency(state.userBalance);
        
        // Reseta quantidade
        document.getElementById('investQuantity').value = 1;
        updateInvestmentTotal();
        
        // Mostra modal
        showModal('investModal');
    }

    function updateInvestmentTotal() {
        if (!state.currentInvestTrack) return;
        
        const quantity = parseInt(document.getElementById('investQuantity').value) || 1;
        const unitPrice = parseFloat(state.currentInvestTrack.valor_acao) || 0;
        const total = quantity * unitPrice;
        
        document.getElementById('investTotalPrice').textContent = formatCurrency(total);
        
        // Valida saldo
        const button = document.getElementById('confirmInvestBtn');
        if (button) {
            button.disabled = total > state.userBalance;
            button.innerHTML = total > state.userBalance ? 
                '<i class="bi bi-exclamation-triangle me-2"></i>Saldo Insuficiente' :
                'Confirmar Investimento';
        }
    }

    async function confirmInvestment() {
        if (!state.currentInvestTrack || !state.currentUser) {
            showToast('Erro: dados incompletos', 'error');
            return;
        }
        
        const quantity = parseInt(document.getElementById('investQuantity').value) || 1;
        const unitPrice = parseFloat(state.currentInvestTrack.valor_acao) || 0;
        const total = quantity * unitPrice;
        
        if (total > state.userBalance) {
            showToast('Saldo insuficiente!', 'error');
            return;
        }
        
        if (quantity <= 0) {
            showToast('Quantidade inválida!', 'error');
            return;
        }
        
        if (!confirm(`Investir R$ ${total.toFixed(2)} em ${quantity} ação(ões) de "${state.currentInvestTrack.titulo}"?`)) {
            return;
        }
        
        showLoading('Processando investimento...');
        
        try {
            const params = new URLSearchParams({
                action: 'buy',
                user_id: state.currentUser.id,
                music_id: state.currentInvestTrack.id,
                quantidade: quantity,
                valor_total: total
            });
            
            const response = await fetch(CONFIG.API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: params.toString()
            });
            
            const result = await response.json();
            hideLoading();
            
            if (result.success) {
                showToast(`Investimento realizado com sucesso!`, 'success');
                closeModal('investModal');
                
                // Atualiza saldo
                state.userBalance = result.data.novo_saldo || (state.userBalance - total);
                updateBalanceUI();
                
                // Atualiza portfólio
                loadPortfolio();
                
            } else {
                showToast(result.message || 'Erro ao realizar investimento', 'error');
            }
        } catch (error) {
            hideLoading();
            console.error('Erro no investimento:', error);
            showToast('Erro de conexão', 'error');
        }
    }

    // ========== PAINEL DO ARTISTA ==========
    async function loadArtistData() {
        if (!state.currentUser || state.currentUser.tipo !== 'artista') return;
        
        try {
            const url = `${CONFIG.API_URL}?action=get_artist_data&user_id=${state.currentUser.id}`;
            const response = await fetch(url);
            const result = await response.json();
            
            if (result.success) {
                // Atualiza estatísticas
                document.getElementById('artistMusicCount').textContent = result.data.total_musicas || 0;
                document.getElementById('artistRoyalties').textContent = formatCurrency(result.data.total_royalties || 0);
                document.getElementById('artistSharesSold').textContent = result.data.total_acoes_vendidas || 0;
                
                // Renderiza músicas
                loadArtistMusics(result.data.musicas || []);
            }
        } catch (error) {
            console.error('Erro ao carregar dados do artista:', error);
        }
    }

    function loadArtistMusics(musicas) {
        const container = document.getElementById('artistMusicContent');
        if (!container) return;
        
        if (!musicas || musicas.length === 0) {
            container.innerHTML = `
                <div class="empty-state col-12">
                    <div class="empty-icon">
                        <i class="bi bi-music-note-beamed"></i>
                    </div>
                    <h5 class="text-muted">Nenhuma música cadastrada</h5>
                    <button class="btn btn-miv mt-3" onclick="openAddMusicModal()">
                        <i class="bi bi-plus-circle me-2"></i>
                        Cadastrar Primeira Música
                    </button>
                </div>
            `;
            return;
        }
        
        container.innerHTML = '';
        
        musicas.forEach((musica, index) => {
            const card = document.createElement('div');
            card.className = 'music-card';
            
            const percentSold = musica.percentual_vendido || 0;
            const totalRaised = musica.arrecadacao_total || 0;
            
            card.innerHTML = `
                <img src="${musica.link_capa || 'https://via.placeholder.com/300x300/111418/00ff88?text=MIV'}" 
                     class="music-cover" 
                     alt="${musica.titulo}"
                     onerror="this.src='https://via.placeholder.com/300x300/111418/00ff88?text=MIV'">
                <div class="music-info">
                    <h5 class="music-title">${musica.titulo}</h5>
                    <p class="music-artist">${musica.genero || 'Gênero não informado'}</p>
                    
                    <div class="progress mb-2" style="height: 10px;">
                        <div class="progress-bar bg-success" style="width: ${percentSold}%"></div>
                    </div>
                    <small class="text-muted d-block mb-2">${percentSold.toFixed(1)}% vendido (R$ ${totalRaised.toFixed(2)})</small>
                    
                    <div class="row text-center mb-2">
                        <div class="col-6">
                            <small class="text-muted">Valor/ação</small>
                            <div class="fw-bold text-success">R$ ${parseFloat(musica.valor_acao || 0).toFixed(2)}</div>
                        </div>
                        <div class="col-6">
                            <small class="text-muted">Disponíveis</small>
                            <div class="fw-bold">${musica.acoes_disponiveis || 0}</div>
                        </div>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button class="btn btn-sm btn-outline-primary" onclick="playArtistMusic(${musica.id})">
                            <i class="bi bi-play-fill"></i> Ouvir
                        </button>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function playArtistMusic(musicId) {
        const index = state.playlist.findIndex(m => m.id == musicId);
        if (index !== -1) {
            playTrack(index);
        }
    }

    function openAddMusicModal() {
        // Limpa formulário
        document.getElementById('musicTitle').value = '';
        document.getElementById('musicGenre').value = '';
        document.getElementById('musicYoutube').value = '';
        document.getElementById('musicCover').value = '';
        document.getElementById('musicPrice').value = '10.00';
        document.getElementById('musicPercent').value = '20';
        
        showModal('addMusicModal');
    }

    async function registerMusic() {
        if (!state.currentUser || state.currentUser.tipo !== 'artista') {
            showToast('Apenas artistas podem cadastrar músicas', 'error');
            return;
        }
        
        const title = document.getElementById('musicTitle').value.trim();
        const genre = document.getElementById('musicGenre').value;
        const youtube = document.getElementById('musicYoutube').value.trim();
        const cover = document.getElementById('musicCover').value.trim();
        const price = document.getElementById('musicPrice').value;
        const percent = document.getElementById('musicPercent').value;
        
        // Validação
        if (!title || !genre || !youtube) {
            showToast('Preencha título, gênero e link do YouTube', 'error');
            return;
        }
        
        if (!isValidYouTubeUrl(youtube)) {
            showToast('Insira um link válido do YouTube', 'error');
            return;
        }
        
        const priceNum = parseFloat(price);
        const percentNum = parseInt(percent);
        
        if (priceNum <= 0) {
            showToast('Valor por ação deve ser positivo', 'error');
            return;
        }
        
        if (percentNum < 1 || percentNum > 100) {
            showToast('Percentual deve ser entre 1% e 100%', 'error');
            return;
        }
        
        showLoading('Cadastrando música...');
        
        try {
            const params = new URLSearchParams({
                action: 'uploadMusic',
                user_id: state.currentUser.id,
                titulo: title,
                artista: state.currentUser.nome,
                genero: genre,
                link_youtube: youtube,
                link_capa: cover,
                valor_acao: priceNum,
                percentual_disponivel: percentNum
            });
            
            const response = await fetch(CONFIG.API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: params.toString()
            });
            
            const result = await response.json();
            hideLoading();
            
            if (result.success) {
                showToast('Música cadastrada com sucesso!', 'success');
                closeModal('addMusicModal');
                
                // Recarrega dados
                loadMarketplace();
                loadArtistData();
                
            } else {
                showToast(result.message || 'Erro ao cadastrar música', 'error');
            }
        } catch (error) {
            hideLoading();
            console.error('Erro ao cadastrar música:', error);
            showToast('Erro de conexão', 'error');
        }
    }

    function isValidYouTubeUrl(url) {
        return extractYouTubeId(url) !== null;
    }

    // ========== EXTRATO FINANCEIRO ==========
    async function loadLedger() {
        if (!state.currentUser) return;
        
        try {
            const url = `${CONFIG.API_URL}?action=get_extrato&user_id=${state.currentUser.id}`;
            const response = await fetch(url);
            const result = await response.json();
            
            if (result.success) {
                renderLedger(result.data || []);
            } else {
                showEmptyState('ledgerContent', 'Nenhuma transação encontrada.');
            }
        } catch (error) {
            console.error('Erro ao carregar extrato:', error);
            showEmptyState('ledgerContent', 'Erro ao carregar extrato.');
        }
    }

    function renderLedger(transactions) {
        const container = document.getElementById('ledgerContent');
        if (!container) return;
        
        if (!transactions || transactions.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">
                        <i class="bi bi-receipt"></i>
                    </div>
                    <h5 class="text-muted">Nenhuma transação encontrada</h5>
                </div>
            `;
            return;
        }
        
        let html = '<div class="table-responsive"><table class="ledger-table">';
        html += `
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Descrição</th>
                    <th>Tipo</th>
                    <th class="text-end">Valor</th>
                </tr>
            </thead>
            <tbody>
        `;
        
        transactions.forEach(trans => {
            const typeClass = trans.valor > 0 ? 'transaction-type deposit' : 
                             trans.tipo?.includes('SAQUE') ? 'transaction-type withdraw' : 
                             'transaction-type purchase';
            
            const typeLabel = trans.valor > 0 ? 'DEPÓSITO' : 
                             trans.tipo?.includes('SAQUE') ? 'SAQUE' : 
                             'INVESTIMENTO';
            
            html += `
                <tr>
                    <td>${formatDate(trans.data)}</td>
                    <td>${trans.descricao || 'Transação'}</td>
                    <td><span class="${typeClass}">${typeLabel}</span></td>
                    <td class="text-end ${trans.valor > 0 ? 'text-success' : 'text-danger'} fw-bold">
                        ${trans.valor > 0 ? '+' : ''}${formatCurrency(trans.valor)}
                    </td>
                </tr>
            `;
        });
        
        html += '</tbody></table></div>';
        container.innerHTML = html;
    }

    // ========== TRANSAÇÕES FINANCEIRAS ==========
    function openFinanceModal() {
        showModal('financeModal');
        showFinanceTab('deposit');
    }

    function showFinanceTab(tab) {
        // Atualiza botões
        document.querySelectorAll('#financeModal .tabs button').forEach(btn => {
            btn.classList.remove('active');
        });
        
        if (tab === 'deposit') {
            document.querySelector('#financeModal .tabs button:nth-child(1)').classList.add('active');
            document.getElementById('depositTab').style.display = 'block';
            document.getElementById('withdrawTab').style.display = 'none';
            document.getElementById('confirmFinanceBtn').innerHTML = '<i class="bi bi-check-circle me-2"></i>Confirmar Depósito';
        } else {
            document.querySelector('#financeModal .tabs button:nth-child(2)').classList.add('active');
            document.getElementById('depositTab').style.display = 'none';
            document.getElementById('withdrawTab').style.display = 'block';
            document.getElementById('confirmFinanceBtn').innerHTML = '<i class="bi bi-check-circle me-2"></i>Solicitar Saque';
        }
        
        // Atualiza saldo
        document.getElementById('modalAvailableBalance').textContent = formatCurrency(state.userBalance);
    }

    async function processFinanceTransaction() {
        const depositTabActive = document.getElementById('depositTab').style.display !== 'none';
        
        if (depositTabActive) {
            await processDeposit();
        } else {
            await processWithdraw();
        }
    }

    async function processDeposit() {
        const amount = parseFloat(document.getElementById('depositAmount').value);
        const reference = document.getElementById('depositReference').value.trim();
        
        if (!amount || amount < 10) {
            showToast('Valor mínimo: R$ 10,00', 'error');
            return;
        }
        
        if (!reference) {
            showToast('Informe o código da transação PIX', 'error');
            return;
        }
        
        if (!confirm(`Confirmar depósito de ${formatCurrency(amount)}?`)) {
            return;
        }
        
        showLoading('Confirmando depósito...');
        
        try {
            const params = new URLSearchParams({
                action: 'confirmar_deposito',
                user_id: state.currentUser.id,
                valor: amount,
                referencia: reference
            });
            
            const response = await fetch(CONFIG.API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: params.toString()
            });
            
            const result = await response.json();
            hideLoading();
            
            if (result.success) {
                showToast('Depósito confirmado!', 'success');
                closeModal('financeModal');
                
                // Atualiza saldo
                state.userBalance += amount;
                updateBalanceUI();
                
                // Atualiza extrato
                loadLedger();
                
            } else {
                showToast(result.message || 'Erro ao confirmar depósito', 'error');
                }
        } catch (error) {
            hideLoading();
            console.error('Erro no depósito:', error);
            showToast('Erro de conexão', 'error');
        }
    }

    async function processWithdraw() {
        const amount = parseFloat(document.getElementById('withdrawAmount').value);
        const pixKey = document.getElementById('withdrawPixKey').value.trim();
        const pixType = document.getElementById('withdrawPixType').value;
        
        if (!amount || amount < 20) {
            showToast('Valor mínimo para saque: R$ 20,00', 'error');
            return;
        }
        
        if (amount > state.userBalance) {
            showToast('Saldo insuficiente para saque', 'error');
            return;
        }
        
        if (!pixKey) {
            showToast('Informe a chave PIX para recebimento', 'error');
            return;
        }
        
        if (!confirm(`Solicitar saque de ${formatCurrency(amount)} para ${pixKey}?`)) {
            return;
        }
        
        showLoading('Solicitando saque...');
        
        try {
            const params = new URLSearchParams({
                action: 'solicitar_saque',
                user_id: state.currentUser.id,
                valor: amount
            });
            
            const response = await fetch(CONFIG.API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: params.toString()
            });
            
            const result = await response.json();
            hideLoading();
            
            if (result.success) {
                showToast('Saque solicitado! Processamento em até 48h.', 'success');
                closeModal('financeModal');
                
                // Limpa formulário
                document.getElementById('withdrawAmount').value = '50';
                document.getElementById('withdrawPixKey').value = '';
                
            } else {
                showToast(result.message || 'Erro ao solicitar saque', 'error');
            }
        } catch (error) {
            hideLoading();
            console.error('Erro no saque:', error);
            showToast('Erro de conexão', 'error');
        }
    }

    // ========== NAVEGAÇÃO ==========
    function changeSection(sectionId, button = null) {
        // Esconde todas as seções
        document.querySelectorAll('.section').forEach(section => {
            section.classList.remove('active');
        });
        
        // Remove active de todos os botões
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        
        document.querySelectorAll('.nav-link').forEach(link => {
            link.classList.remove('active');
        });
        
        // Ativa seção selecionada
        const section = document.getElementById(sectionId + 'Section');
        if (section) {
            section.classList.add('active');
            
            // Se foi clicado no menu lateral, fecha sidebar em mobile
            if (window.innerWidth <= 768) {
                toggleSidebar(false);
            }
            
            // Atualiza dados da seção
            switch(sectionId) {
                case 'marketplace':
                    loadMarketplace();
                    break;
                case 'portfolio':
                    loadPortfolio();
                    break;
                case 'ledger':
                    loadLedger();
                    break;
                case 'artist':
                    if (state.currentUser?.tipo === 'artista') {
                        loadArtistData();
                    }
                    break;
            }
        }
        
        // Ativa botão correspondente
        if (button) {
            button.classList.add('active');
        }
        
        // Ativa link correspondente no sidebar
        const sidebarLink = document.querySelector(`.nav-link[onclick*="${sectionId}"]`);
        if (sidebarLink) {
            sidebarLink.classList.add('active');
        }
    }

    function toggleSidebar(forceClose = null) {
        const sidebar = document.getElementById('sidebar');
        if (forceClose === false || (sidebar.classList.contains('open') && forceClose === null)) {
            sidebar.classList.remove('open');
        } else {
            sidebar.classList.add('open');
        }
    }

    function showEmptyState(elementId, message) {
        const container = document.getElementById(elementId);
        if (!container) return;
        
        container.innerHTML = `
            <div class="empty-state col-12">
                <div class="empty-icon">
                    <i class="bi bi-music-note-beamed"></i>
                </div>
                <h5 class="text-muted">${message}</h5>
            </div>
        `;
    }

    function copyToClipboard(elementId) {
        const element = document.getElementById(elementId);
        if (!element) return;
        
        element.select();
        element.setSelectionRange(0, 99999);
        
        try {
            navigator.clipboard.writeText(element.value);
            showToast('Copiado para a área de transferência!');
        } catch (error) {
            console.error('Erro ao copiar:', error);
            showToast('Erro ao copiar', 'error');
        }
    }

    // ========== INICIALIZAÇÃO ==========
    document.addEventListener('DOMContentLoaded', function() {
        console.log('🚀 SELO MIV Frontend Iniciado');
        checkAuth();
    });
</script>
