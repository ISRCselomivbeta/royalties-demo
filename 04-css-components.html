<style>
    /* ========== COMPONENTES DE CARREGAMENTO ========== */
    .loading-screen {
        position: fixed;
        inset: 0;
        background: var(--bg-dark);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease;
    }
    
    .loading-content {
        text-align: center;
    }
    
    .loading-spinner {
        width: 4rem;
        height: 4rem;
        border: 0.25rem solid rgba(0, 255, 136, 0.3);
        border-top-color: var(--neon-green);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 1.5rem;
    }
    
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    
    .progress-loading {
        height: 4px;
        background: rgba(0, 255, 136, 0.2);
        border-radius: 2px;
        overflow: hidden;
        margin: 1rem auto;
        max-width: 200px;
    }
    
    .progress-loading-bar {
        height: 100%;
        background: linear-gradient(90deg, var(--neon-green), #00cc6a);
        border-radius: 2px;
        width: 0%;
        animation: loading 2s infinite;
    }
    
    @keyframes loading {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(400%); }
    }
</style>
